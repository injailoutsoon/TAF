server:
  port: 0
spring:
  application:
    name: auth-test

  data:
    mongodb:
      uri: mongodb://localhost:27017/testdb
      auto-index-creation: true
      embedded:
        version: 6.0.5

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework: INFO

taf:
  app:
    jwtSecret: testSecretKey123
    jwtExpirationMs: 60000 # 1 min

eureka:
  client:
    enabled: false
    jwtExpirationMs: 60000 # 1 min
